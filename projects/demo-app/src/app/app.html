<div class="min-h-screen bg-green-900 flex flex-col items-center justify-center gap-6 p-4">
  <div class="w-64">
    <ui-select
      label="Recurso"
      [options]="opciones"
      [(value)]="recurso"
      (selectionChange)="alCambiar($event)"
    />
  </div>
  <p class="text-lime-300">Valor: {{ recurso() }}</p>
  <p class="text-lime-300">Último cambio: {{ ultimo() }}</p>
</div>
